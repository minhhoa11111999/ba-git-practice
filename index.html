<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Race Master - Demo Final</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen flex flex-col items-center p-6">

    <div id="scanner-screen" class="fixed inset-0 z-50 bg-black hidden flex flex-col items-center justify-center p-10">
        <div id="scanner-box" class="relative w-64 h-64 border-2 border-white/20 rounded-[40px] overflow-hidden bg-slate-900">
            <div class="scanner-line"></div>
            <div id="check-icon" class="hidden absolute inset-0 flex items-center justify-center bg-emerald-500/20 z-10">
                <div class="w-16 h-16 bg-emerald-500 rounded-full flex items-center justify-center shadow-lg shadow-emerald-500/50">
                    <i class="fas fa-check text-2xl text-white"></i>
                </div>
            </div>
            <div class="absolute inset-0 flex items-center justify-center opacity-20"><i class="fas fa-qrcode text-8xl"></i></div>
        </div>
        <p id="scan-label" class="mt-8 text-indigo-400 font-black tracking-widest text-[10px] uppercase animate-pulse">Đang quét mã...</p>
    </div>

    <header class="w-full max-w-md flex justify-center mb-12">
        <div class="font-black italic text-2xl tracking-tighter uppercase">RACE<span class="text-indigo-500">MASTER</span></div>
    </header>

    <main id="app-content" class="w-full max-w-md"></main>

    <script src="script.js"></script>
</body>
</html>
